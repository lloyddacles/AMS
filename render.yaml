# Optional: Render Blueprint for the backend (Express + SQLite with a persistent disk).
# You can also configure this manually in the Render dashboard.
services:
  - type: web
    name: attendance-monitoring-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DB_PATH
        value: /var/data/attendance.sqlite
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
