<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>AttendX</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 18%, #1e293b 0%, #0f172a 62%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #boot-splash .bs-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      #boot-splash .bs-logo {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: #fff;
        display: grid;
        place-items: center;
        padding: 12px;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.5), 0 0 0 1px rgba(148, 163, 184, 0.18);
        animation: bs-pulse 1.8s ease-in-out infinite;
      }
      #boot-splash .bs-logo img { width: 100%; height: 100%; object-fit: contain; }
      #boot-splash .bs-brand {
        color: #fff;
        font-weight: 800;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      #boot-splash .bs-tag {
        color: #94a3b8;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #boot-splash .bs-bar {
        width: 176px;
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
        margin-top: 0.4rem;
      }
      #boot-splash .bs-bar span {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        animation: bs-slide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes bs-pulse {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes bs-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-logo, #boot-splash .bs-bar span { animation: none; }
        #boot-splash .bs-bar span { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="bs-inner">
          <div class="bs-logo"><img src="/logo.png" alt="AttendX" /></div>
          <div class="bs-brand">AttendX</div>
          <div class="bs-tag">Attendance Monitoring</div>
          <div class="bs-bar"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
